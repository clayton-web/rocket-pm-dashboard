# Twice-daily Inbox Gmail scheduler (external cron).
#
# UTC times below match America/Vancouver during PDT (UTC-7):
#   07:00 local = 14:00 UTC
#   14:00 local = 21:00 UTC
# During PST (UTC-8), shift cron to 15:00 / 22:00 UTC unless made timezone-aware later.
#
# Automated Daily Briefing scheduling is decommissioned (P0-B). This workflow
# only enqueues independent gmail.sync and drains the shared job queue.
# Vercel cron (vercel.json, 0 6 * * * UTC) remains a once-daily safety-net drain.
name: Scheduled Gmail sync

on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run only (no jobs enqueued, no queue drain)
        required: true
        default: false
        type: boolean

concurrency:
  group: daily-briefing-cron
  cancel-in-progress: false

env:
  APP_BASE_URL: https://www.rocketlogic.ca

jobs:
  schedule-and-drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve dry-run mode
        id: config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enqueue independent Gmail schedule
        env:
          JOB_PROCESSOR_SECRET: ${{ secrets.JOB_PROCESSOR_SECRET }}
        run: |
          set -euo pipefail
          DRY_RUN="${{ steps.config.outputs.dry_run }}"
          BASE="${APP_BASE_URL}/dashboard/api/internal/gmail/schedule"

          if [ "$DRY_RUN" = "true" ]; then
            URL="${BASE}?dryRun=true"
          else
            URL="${BASE}"
          fi

          echo "POST ${URL}"
          HTTP_CODE=$(curl -sS -o /tmp/gmail-schedule-response.json -w "%{http_code}" \
            -X POST "$URL" \
            -H "Authorization: Bearer ${JOB_PROCESSOR_SECRET}")

          echo "HTTP status: ${HTTP_CODE}"
          echo "Response body:"
          cat /tmp/gmail-schedule-response.json
          echo ""

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Independent Gmail schedule request failed."
            exit 1
          fi

      # One drain claims gmail.sync. A second immediate drain picks up active
      # follow-on work created while the first batch ran (e.g. agent.triage).
      # The previous 360s wait existed only for delayed briefing.generate.
      - name: Drain job queue
        if: steps.config.outputs.dry_run != 'true'
        env:
          JOB_PROCESSOR_SECRET: ${{ secrets.JOB_PROCESSOR_SECRET }}
        run: |
          set -euo pipefail
          PROCESS_URL="${APP_BASE_URL}/dashboard/api/internal/jobs/process"

          echo "POST ${PROCESS_URL}"
          HTTP_CODE=$(curl -sS -o /tmp/process-response-1.json -w "%{http_code}" \
            -X POST "$PROCESS_URL" \
            -H "Authorization: Bearer ${JOB_PROCESSOR_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"limit":10}')

          echo "HTTP status: ${HTTP_CODE}"
          echo "Response body:"
          cat /tmp/process-response-1.json
          echo ""

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Initial job processor request failed."
            exit 1
          fi

      - name: Drain job queue (follow-on)
        if: steps.config.outputs.dry_run != 'true'
        env:
          JOB_PROCESSOR_SECRET: ${{ secrets.JOB_PROCESSOR_SECRET }}
        run: |
          set -euo pipefail
          PROCESS_URL="${APP_BASE_URL}/dashboard/api/internal/jobs/process"

          echo "POST ${PROCESS_URL}"
          HTTP_CODE=$(curl -sS -o /tmp/process-response-2.json -w "%{http_code}" \
            -X POST "$PROCESS_URL" \
            -H "Authorization: Bearer ${JOB_PROCESSOR_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"limit":10}')

          echo "HTTP status: ${HTTP_CODE}"
          echo "Response body:"
          cat /tmp/process-response-2.json
          echo ""

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Follow-on job processor request failed."
            exit 1
          fi
